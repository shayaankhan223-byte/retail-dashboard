<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Retail Sales Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:#e2e8f0;margin:0;padding:24px;min-height:100vh}
h1{color:#f8fafc;font-weight:700;letter-spacing:-.5px;margin:0 0 4px}
.sub{color:#94a3b8;margin-bottom:20px}
.filters{display:flex;gap:16px;margin:16px 0;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.05);padding:16px;border-radius:14px;backdrop-filter:blur(8px)}
select,input[type=file]{padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#e2e8f0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:20px 0}
.kpi{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03));padding:20px;border-radius:14px;border:1px solid rgba(255,255,255,.1);transition:transform .2s}
.kpi:hover{transform:translateY(-3px)}
.kpi .l{color:#94a3b8;font-size:13px}
.kpi .v{font-size:26px;font-weight:700;color:#38bdf8;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:rgba(255,255,255,.06);padding:20px;border-radius:14px;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px)}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="login" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e293b);z-index:1000">
<div style="background:rgba(255,255,255,.08);padding:32px;border-radius:16px;width:320px;border:1px solid rgba(255,255,255,.1)">
<h2 style="color:#f8fafc;margin:0 0 16px">Login</h2>
<input id="u" placeholder="Username" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#e2e8f0">
<input id="p" type="password" placeholder="Password" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#e2e8f0">
<button onclick="doLogin()" style="width:100%;padding:10px;margin-top:8px;border:none;border-radius:8px;background:#38bdf8;color:#0f172a;font-weight:700;cursor:pointer">Sign In</button>
<div id="err" style="color:#f87171;margin-top:8px;font-size:13px"></div>
</div></div>
<script>
const USERS={"hammadamjad":"15955","ahsan khan":"17183","huzaifa khan":"17151"};
function doLogin(){const u=document.getElementById('u').value.trim().toLowerCase();const p=document.getElementById('p').value; if(USERS[u]&&USERS[u]===p){localStorage.setItem('auth',u);document.getElementById('login').style.display='none';}else{document.getElementById('err').textContent='Invalid credentials';}}
if(localStorage.getItem('auth')){document.addEventListener('DOMContentLoaded',()=>{const l=document.getElementById('login'); if(l) l.style.display='none';});}
</script>

let valueCol=null, dateCol=null, catCols=[];
function detect(){
  if(!DATA.length) return;
  const cols=Object.keys(DATA[0]);
  // numeric columns
  const numeric=cols.filter(c=>DATA.some(r=>typeof r[c]==='number' && r[c]!==null));
  valueCol = numeric.find(c=>/revenue|sales|amount|price|total|value|qty|quantity/i.test(c)) || numeric[0] || null;
  // date column
  dateCol = cols.find(c=>/date|time/i.test(c)) || cols.find(c=>DATA.some(r=>typeof r[c]==='string' && !isNaN(Date.parse(r[c])))) || null;
  // categorical columns (non-numeric, non-date)
  catCols = cols.filter(c=>c!==dateCol && !numeric.includes(c));
}
const f1=document.getElementById('f1'), f2=document.getElementById('f2');
function rebuildFilters(){
  f1.innerHTML='<option>All</option>'; f2.innerHTML='<option>All</option>';
  if(catCols[0]) [...new Set(DATA.map(d=>d[catCols[0]]))].filter(v=>v!=null).sort().forEach(v=>f1.add(new Option(v,v)));
  if(catCols[1]) [...new Set(DATA.map(d=>d[catCols[1]]))].filter(v=>v!=null).sort().forEach(v=>f2.add(new Option(v,v)));
}
function agg(rows,key){const m={};rows.forEach(r=>{const k=r[key]; if(k==null) return; m[k]=(m[k]||0)+(Number(r[valueCol])||0);});return m;}
function monthly(rows){const m={};rows.forEach(r=>{if(!dateCol) return; const d=new Date(r[dateCol]); if(isNaN(d)) return; const mm=d.toISOString().slice(0,7); m[mm]=(m[mm]||0)+(Number(r[valueCol])||0);});return m;}
let charts={};
function update(){
  const v1=f1.value, v2=f2.value;
  const rows=DATA.filter(d=>(v1==='All'||d[catCols[0]]===v1)&&(v2==='All'||!catCols[1]||d[catCols[1]]===v2));
  const vals=rows.map(r=>Number(r[valueCol])||0);
  const total=vals.reduce((a,b)=>a+b,0);
  document.getElementById('tr').textContent=total.toLocaleString(undefined,{maximumFractionDigits:2});
  document.getElementById('to').textContent=rows.length.toLocaleString();
  document.getElementById('ao').textContent=(rows.length?total/rows.length:0).toFixed(2);
  const g1=catCols[0]?agg(rows,catCols[0]):{};
  const top=Object.entries(g1).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('tc').textContent=top?top[0]:'-';
  if(charts.c1) charts.c1.destroy();
  charts.c1=new Chart(document.getElementById('c1'),{type:'bar',data:{labels:Object.keys(g1),datasets:[{label:valueCol||'value',data:Object.values(g1),backgroundColor:'#4C78A8'}]},options:{responsive:true,plugins:{title:{display:true,text:catCols[0]?'By '+catCols[0]:'Distribution'}}}});
  const g2=catCols[1]?agg(rows,catCols[1]):{};
  if(charts.c2) charts.c2.destroy();
  charts.c2=new Chart(document.getElementById('c2'),{type:'pie',data:{labels:Object.keys(g2),datasets:[{data:Object.values(g2),backgroundColor:['#4C78A8','#F58518','#E45756','#72B7B2','#54A24B','#B279A2']}]},options:{responsive:true,plugins:{title:{display:true,text:catCols[1]?'By '+catCols[1]:'Breakdown'}}}});
  const gm=monthly(rows);
  const ml=Object.keys(gm).sort();
  if(charts.c3) charts.c3.destroy();
  charts.c3=new Chart(document.getElementById('c3'),{type:'line',data:{labels:ml,datasets:[{label:valueCol||'value',data:ml.map(k=>gm[k]),borderColor:'#F58518',fill:false,tension:.3}]},options:{responsive:true,plugins:{title:{display:true,text:'Trend over time'}}}});
}
document.getElementById('file').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    const lines=ev.target.result.trim().split('\n');
    const hdr=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
    DATA=lines.slice(1).filter(l=>l.trim()).map(l=>{
      const v=l.split(','); const o={};
      hdr.forEach((h,i)=>{const raw=(v[i]||'').trim().replace(/^"|"$/g,''); const num=Number(raw); o[h]= (raw!=='' && !isNaN(num))?num:raw;});
      return o;
    });
    detect(); rebuildFilters(); update();
  };
  r.readAsText(f);
});
f1.addEventListener('change',update);
f2.addEventListener('change',update);
detect(); rebuildFilters(); update();
